<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Admin – Trabajo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Trabajo · Admin</div>
    <div class="usage" id="usageBox">
      <span id="usageText">—</span>
      <div class="bar"><div id="usageBar"></div></div>
    </div>
    <div class="keybox">
      <input id="adminKeyInput" type="password" placeholder="Admin Key" autocomplete="off">
      <button id="saveKeyBtn" class="btn">Guardar</button>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="row">
        <button id="refresh" class="btn btn-primary">Recargar</button>
        <button id="selectPage" class="btn">Seleccionar página</button>
        <button id="clearSel" class="btn">Limpiar selección</button>
      </div>
      <div class="row">
        <button id="downloadLinks" class="btn">Descargar (links)</button>
        <button id="archiveOnly" class="btn">Solo approved = false</button>
        <button id="deleteAndDisapprove" class="btn btn-danger">Borrar Storage + approved=false</button>
      </div>
      <small id="hint" class="hint hidden"></small>
    </section>

    <section class="tablewrap">
      <table class="table" id="grid">
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox" id="checkAllPage"></th>
            <th>id</th>
            <th>file_path</th>
            <th>mime</th>
            <th>dur(s)</th>
            <th>size</th>
            <th>approved</th>
            <th>created_at</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <!-- rows -->
        </tbody>
      </table>
      <div class="pager">
        <button id="prev" class="btn">←</button>
        <span id="pageInfo">—</span>
        <button id="next" class="btn">→</button>
      </div>
    </section>

    <section class="result hidden" id="resultBox"></section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- ===== CONFIG: pega tus valores públicos ===== -->
  <script>
    // Usa exactamente los mismos valores que ya tienes en index/escuchar
    // (estos son ejemplos; reemplázalos por los tuyos)
    window.SUPABASE_URL = 'https://kozwtpgopvxrvkbvsaeo.supabase.co';
    window.SUPABASE_ANON_KEY = 'TU_ANON_KEY_PUBLICO';
    // Opcional: si tu admin usa bucket/prefix en front
    window.BUCKET = 'audios';
    window.PREFIX = 'recordings';
  </script>
  <!-- ============================================ -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./admin.js" type="module"></script>
</body>
</html>
